[project]
name = "sia"
version = "0.1.0"
description = "Sia: a custom voice assistant powered by Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sia = "sia.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
